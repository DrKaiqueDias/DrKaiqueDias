name: Atualizar cobrinha de contribuicoes

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar efeito de divisao e reuniao
        run: python -m unittest discover -s scripts -v
      - name: Gerar animacoes clara e escura
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%230d9488
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2359d5ce
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Adicionar segunda cobra e reuniao
        run: python scripts/enhance_snake.py dist/github-snake.svg dist/github-snake-dark.svg

      - name: Publicar animacoes na branch output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/github-snake.svg
          test -s dist/github-snake-dark.svg
          cd dist
          git init -b output
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-snake.svg github-snake-dark.svg
          git commit -m 'Atualizar animacao de contribuicoes'
          gh auth setup-git
          git remote add origin "https://github.com/${GH_REPO}.git"
          git push --force origin HEAD:output
