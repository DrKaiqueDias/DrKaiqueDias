<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">Kaique Dias — AI, strategy and human impact</title>
<desc id="desc">A midnight-blue personal banner with a slowly rotating orbital diagram connecting intelligence, judgment and impact.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#102c37"/></linearGradient>
  <linearGradient id="line"><stop stop-color="#59d5ce"/><stop offset="1" stop-color="#d5b878"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8cb4be" stroke-opacity=".045"/></pattern>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .orbit{transform-origin:822px 158px;animation:turn 36s linear infinite}
    .glow{animation:breathe 6s ease-in-out infinite}
    @keyframes turn{to{transform:rotate(360deg)}}
    @keyframes breathe{0%,100%{opacity:.35}50%{opacity:.9}}
    @media(prefers-reduced-motion:reduce){.orbit,.glow{animation:none}}
  </style>
</defs>
<rect width="1000" height="330" rx="20" fill="url(#bg)"/>
<rect width="1000" height="330" rx="20" fill="url(#grid)"/>
<rect x="42" y="42" width="34" height="3" rx="1.5" fill="#59d5ce"/>
<text x="89" y="48" fill="#a8bec8" font-size="12" letter-spacing="3">INTELLIGENCE WITH PURPOSE</text>
<text x="42" y="124" fill="#f0f5f7" font-size="62" font-weight="700" letter-spacing="-2">Kaique Dias</text>
<text x="45" y="165" fill="#83e1d9" font-size="21">AI quality. Strategic judgment. Human impact.</text>
<text x="45" y="212" fill="#c5d3db" font-size="16">Oracle at Scale AI</text>
<text x="45" y="240" fill="#a3b9c6" font-size="15">Finance · Leadership · Law · Emerging technology</text>
<path d="M44 276H620" stroke="url(#line)" stroke-opacity=".55"/>
<text x="45" y="301" fill="#a3b9c6" font-size="11" letter-spacing="2">RIO DE JANEIRO / GLOBAL PERSPECTIVE</text>
<circle cx="822" cy="158" r="106" fill="none" stroke="#7199a4" stroke-opacity=".2"/>
<circle cx="822" cy="158" r="77" fill="none" stroke="#7199a4" stroke-opacity=".25" stroke-dasharray="2 8"/>
<circle cx="822" cy="158" r="46" fill="#112c37" stroke="#59d5ce" stroke-opacity=".5"/>
<circle class="glow" cx="822" cy="158" r="55" fill="none" stroke="#59d5ce" stroke-opacity=".25"/>
<text x="822" y="167" text-anchor="middle" fill="#eef6f8" font-size="25" font-weight="700" letter-spacing="2">KD</text>
<g class="orbit">
 <path d="M822 52L914 211L730 211Z" fill="none" stroke="url(#line)" stroke-opacity=".4"/>
 <circle cx="822" cy="52" r="7" fill="#59d5ce"/>
 <circle cx="914" cy="211" r="6" fill="#d5b878"/>
 <circle cx="730" cy="211" r="5" fill="#acc6df"/>
</g>
<text x="822" y="294" text-anchor="middle" fill="#a3b9c6" font-size="11" letter-spacing="2">CONNECTING DISCIPLINES</text>
</svg>
